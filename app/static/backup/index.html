<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Activity Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <h1>Activity Tracker</h1>

    <!-- HISTORY -->

    <section>
        <div class="section-header">
            <h2>Activity History</h2>
        </div>

        <ul id="activities"></ul>
    </section>


    <!-- ACTIVITY FORM -->

    <section>
        <div class="form-tabs">
            <button id="currentTab" type="button">
                Current
            </button>

            <button id="addPastTab" type="button">
                Add past
            </button>
        </div>

        <div class="section-header">
            <h2 id="activityHeading">New Activity</h2>
            <span id="timer">00:00:00</span>
        </div>

        <div class="form-row field">
            <div>
                <label for="activityName">Name</label>
                <input
                    id="activityName"
                    type="text"
                    maxlength="30"
                    placeholder="Activity name"
                >
            </div>

            <div>
                <label for="activityType">Type</label>
                <select id="activityType"></select>
            </div>
        </div>

        <!-- START AND END TIMES -->
        <div id="timeFields" class="form-row field" hidden>
            <div>
                <label for="startedAt">Start time</label>
                <input id="startedAt" type="datetime-local">
            </div>

            <div>
                <label for="endedAt">End time</label>
                <input id="endedAt" type="datetime-local">
            </div>
        </div>

        <div class="field">
            <label for="activityNotes">Notes</label>
            <textarea
                id="activityNotes"
                rows="3"
                placeholder="Optional notes..."
            ></textarea>
        </div>

        <div class="field" id="ratingField" hidden>
            <label for="easeRating">Ease of work</label>
            <select id="easeRating"></select>
        </div>

        <div class="actions">

            <button id="startButton" type="button">
                Start Activity
            </button>

            <button id="saveButton" type="button" hidden>
                Save
            </button>

            <button id="stopButton" type="button" hidden>
                Stop
            </button>
            <button id="deleteButton" type="button" hidden>
                Delete
            </button>

            <button id="cancelButton" type="button" hidden>
                Cancel
            </button>

            <span id="saveStatus" role="status" aria-live="polite"></span>

        </div>
        <i>Ctrl + win + t</i>
    </section>
    <script src="/static/app.js" defer></script>

</body>
</html>
