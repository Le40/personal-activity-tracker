<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Activity Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/ui-additions.css?v=2">
</head>
<body>
    <main id="app" v-cloak>
        <h1>Activity Tracker</h1>

        <section aria-labelledby="historyHeading">
            <div class="section-header">
                <h2 id="historyHeading">Activity History</h2>

                <input
                    type="date"
                    class="history-date-picker"
                    aria-label="Select history date"
                    lang="sk-SK"
                    v-model="historyDate"
                    :disabled="busy"
                    @change="onHistoryDateChange"
                >
            </div>
            <ul id="activities">
                <li v-for="activity in history" :key="activity.id">
                    <button type="button" class="history-item" :disabled="busy"
                            @click="changeMode('edit', activity)" title="Edit activity">
                        <span class="history-time">
                            {{ formatTime(activity.started_at) }} – {{ formatTime(activity.ended_at) }}
                        </span>
                        <span class="history-name" :title="displayName(activity)">
                            {{ displayName(activity) }}
                        </span>
                        <span class="history-details">
                        <span class="history-type">{{ typeLabel(activity.activity_type) }}</span>
                        <span class="history-separator">|</span>
                        <span class="history-duration">
                            {{ formatDuration(activity.started_at, activity.ended_at) }}
                        </span>
                    </span>
                    </button>
                </li>
                <li v-if="!history.length" class="empty-history">No completed activities for this day.</li>
            </ul>
        </section>

        <section class="activity-section" aria-labelledby="activityHeading">
            <div class="form-tabs" role="group" aria-label="Activity mode">
                <button class="mode-tab" type="button" :aria-pressed="formMode === 'current'"
                        :disabled="busy" @click="changeMode('current')">Current activity</button>
                <button class="mode-tab" type="button" :aria-pressed="formMode !== 'current'"
                        :disabled="busy" @click="changeMode('add')">Past activity</button>
                <button
                    type="button"
                    class="form-collapse-button"
                    :aria-expanded="!formCollapsed"
                    aria-controls="activityFormBody"
                    :title="formCollapsed ? 'Expand form' : 'Collapse form'"
                    :aria-label="formCollapsed ? 'Expand form' : 'Collapse form'"
                    @click="formCollapsed = !formCollapsed"
                >
                    {{ formCollapsed ? '+' : '−' }}
                </button>
            </div>

            <div class="activity-panel">
                <div class="section-header">
                    <h2 id="activityHeading">{{ heading }}</h2>

                    <span id="timer" v-show="formMode === 'current'">
                        {{ timerText }}
                    </span>
                </div>

                <div id="activityFormBody" :inert="formCollapsed">
                    <div class="form-body-inner">

                        <div class="form-row field">
                            <div>
                                <label for="activityName">Name (optional)</label>
                                <input id="activityName" type="text" maxlength="30" placeholder="Optional name"
                                    v-model="form.name" :disabled="busy" @input="markUnsaved">
                            </div>
                            <div>
                                <label for="activityType">Type</label>
                                <select id="activityType" v-model="form.activity_type" :disabled="busy"
                                        @change="onTypeChanged">
                                    <option v-for="type in activityOptions" :key="type.value" :value="type.value">
                                        {{ type.label }}
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div id="timeFields" class="form-row field" v-show="formMode !== 'current'">
                            <div>
                                <label for="startedAt">Start time</label>
                                <div class="datetime-control">
                                    <span class="datetime-display" aria-hidden="true">
                                        {{ datetimeLabel(form.started_at) }}
                                    </span>
                                    <svg class="calendar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                        <rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
                                        <path d="M7 3v5M17 3v5M3 10h18" fill="none" stroke="currentColor" stroke-width="1.8"/>
                                    </svg>
                                    <input id="startedAt" type="datetime-local" lang="sk-SK" step="60"
                                        aria-label="Select start date and time" v-model="form.started_at"
                                        :disabled="busy" @input="markUnsaved" @change="markUnsaved"
                                        @click="openDatePicker">
                                </div>
                            </div>
                            <div>
                                <label for="endedAt">End time</label>
                                <div class="datetime-control">
                                    <span class="datetime-display" aria-hidden="true">
                                        {{ datetimeLabel(form.ended_at) }}
                                    </span>
                                    <svg class="calendar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                        <rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
                                        <path d="M7 3v5M17 3v5M3 10h18" fill="none" stroke="currentColor" stroke-width="1.8"/>
                                    </svg>
                                    <input id="endedAt" type="datetime-local" lang="sk-SK" step="60"
                                        aria-label="Select end date and time" v-model="form.ended_at"
                                        :disabled="busy" @input="markUnsaved" @change="markUnsaved"
                                        @click="openDatePicker">
                                </div>
                            </div>
                        </div>

                        <div class="field">
                            <label for="activityNotes">Notes</label>
                            <textarea id="activityNotes" rows="3" placeholder="Optional notes..."
                                    v-model="form.notes" :disabled="busy" @input="markUnsaved"></textarea>
                        </div>

                        <div class="field" id="ratingField" v-show="supportsRating">
                            <label for="easeRating">Ease of work</label>
                            <select id="easeRating" v-model="form.ease_rating" :disabled="busy" @change="markUnsaved">
                                <option value="">Not rated</option>
                                <option v-for="rating in easeRatings" :key="rating.value" :value="String(rating.value)">
                                    {{ rating.value }} - {{ rating.label }}
                                </option>
                            </select>
                        </div>

                        <div class="actions">
                            <button v-if="formMode === 'current' && !activeActivity" type="button"
                                    :disabled="busy" @click="startActivity">Start Activity</button>
                            <button v-if="formMode !== 'current' || activeActivity" type="button"
                                    :disabled="busy" @click="saveActivity">Save</button>
                            <button v-if="formMode === 'current' && activeActivity" type="button"
                                    :disabled="busy" @click="stopActivity">Stop</button>
                            <button v-if="(formMode === 'current' && activeActivity) || formMode === 'edit'"
                                    type="button" :disabled="busy" @click="deleteActivity">Delete</button>
                            <button v-if="formMode !== 'current'" type="button"
                                    :disabled="busy" @click="changeMode('current')">Cancel</button>
                            <span id="saveStatus" role="status" aria-live="polite" :class="statusState">
                                {{ statusMessage }}
                            </span>
                        </div>
                        <i>Ctrl + win + t</i>
                    </div> <!-- form-body-inner -->
                </div> <!-- activityFormBody -->
            </div>
        </section>
        <dialog ref="confirmDialog" class="confirm-dialog">
            <p>{{ confirmMessage }}</p>

            <form method="dialog" class="confirm-actions">
                <button type="submit" value="cancel">Cancel</button>
                <button type="submit" value="confirm">OK</button>
            </form>
        </dialog>
    </main>

    <script src="/static/vue.global.prod.js" defer></script>
    <script src="/static/app.js" defer></script>
</body>
</html>
