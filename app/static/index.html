<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Activity Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 13px;
            max-width: 360px;
            margin: 10px auto;
            padding: 0 10px;
            color: #222;
        }

        h1 {
            font-size: 18px;
            margin: 0 0 12px;
        }

        h2 {
            font-size: 14px;
            margin: 0;
        }

        section {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1.7fr 1fr;
            gap: 8px;
        }

        label {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
        }

        input, select, textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 7px;
            font: inherit;
            border: 1px solid #bbb;
            border-radius: 4px;
        }

        textarea {
            min-height: 85px;
            resize: vertical;
        }

        .field {
            margin-bottom: 10px;
        }

        #timer {
            font-size: 18px;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
        }

        button {
            padding: 7px 11px;
            cursor: pointer;
            border: 1px solid #aaa;
            border-radius: 4px;
            background: #f5f5f5;
        }

        button:hover {
            background: #e8e8e8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #saveStatus {
            flex: 1 1 100%;
            margin-left: 0;
            font-size: 11px;
            overflow-wrap: anywhere;
        }
        #saveStatus.saved {
            color: #16803c;
        }

        #saveStatus.unsaved {
            color: #b36b00;
        }

        #saveStatus.error {
            color: #c62828;
        }

        #sessions {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 130px;
            overflow-y: auto;
        }

        #sessions li {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
            overflow-wrap: anywhere;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>

    <h1>Activity Tracker</h1>

    <!-- HISTORY -->

    <section>
        <div class="section-header">
            <h2>Activity History</h2>
        </div>

        <ul id="sessions"></ul>
    </section>


    <!-- ACTIVITY FORM -->

    <section>

        <div class="section-header">
            <h2 id="activityHeading">New Activity</h2>
            <span id="timer">00:00:00</span>
        </div>

        <div class="form-row field">
            <div>
                <label for="activityName">Name</label>
                <input
                    id="activityName"
                    type="text"
                    maxlength="30"
                    placeholder="Activity name"
                >
            </div>

            <div>
                <label for="activityType">Type</label>
                <select id="activityType">
                    <option value="work">Work</option>
                    <option value="exercise">Exercise</option>
                    <option value="meal">Meal</option>
                    <option value="break">Break</option>
                    <option value="other">Other</option>
                </select>
            </div>
        </div>

        <div class="field">
            <label for="activityNotes">Notes</label>
            <textarea
                id="activityNotes"
                rows="3"
                placeholder="Optional notes..."
            ></textarea>
        </div>

        <div class="actions">

            <button id="startButton" type="button">
                Start Activity
            </button>

            <button id="saveButton" type="button" hidden>
                Save
            </button>

            <button id="stopButton" type="button" hidden>
                Stop
            </button>

            <span id="saveStatus" role="status" aria-live="polite"></span>

        </div>

    </section>


    <script>
        let activeActivity = null;
        let busy = false;


        // TIME

        function parseTimestamp(timestamp) {
            const hasTimezone = /(?:Z|[+-]\d{2}:\d{2})$/i.test(timestamp);

            return new Date(hasTimezone ? timestamp : timestamp + "Z");
        }

        function formatTime(timestamp) {
            return parseTimestamp(timestamp).toLocaleTimeString("sk-SK", {
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        function updateTimer() {
            if (!activeActivity) return;

            const started = parseTimestamp(activeActivity.started_at);

            const elapsed = Math.max(
                0,
                Math.floor((Date.now() - started.getTime()) / 1000)
            );

            const hours = Math.floor(elapsed / 3600);
            const minutes = Math.floor((elapsed % 3600) / 60);
            const seconds = elapsed % 60;

            const pad = value => String(value).padStart(2, "0");

            document.getElementById("timer").textContent =
                `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
        }


        // SAVE STATUS

        function setSaveStatus(message, state = "") {
            const status = document.getElementById("saveStatus");

            status.textContent = message;
            status.className = state;
        }

        function markUnsaved() {
            if (activeActivity && !busy) {
                setSaveStatus("● Unsaved changes", "unsaved");
            }
        }

        document.getElementById("activityName")
            .addEventListener("input", markUnsaved);

        document.getElementById("activityNotes")
            .addEventListener("input", markUnsaved);

        document.getElementById("activityType")
            .addEventListener("change", markUnsaved);


        // API

        async function apiRequest(url, options = {}) {
            const response = await fetch(url, options);

            if (!response.ok) {
                throw new Error(`Request failed: HTTP ${response.status}`);
            }

            return response.json();
        }


        // FORM

        function readActivityForm() {
            const name =
                document.getElementById("activityName").value.trim();

            const activityType =
                document.getElementById("activityType").value;

            const notes =
                document.getElementById("activityNotes").value;

            if (!name) {
                throw new Error("Activity name cannot be empty.");
            }

            return {
                name: name,
                activity_type: activityType,
                notes: notes
            };
        }

        function displayActivityForm() {
            const isRunning = activeActivity !== null;

            document.getElementById("activityHeading").textContent =
                isRunning ? "Current Activity" : "New Activity";

            document.getElementById("startButton").hidden = isRunning;
            document.getElementById("saveButton").hidden = !isRunning;
            document.getElementById("stopButton").hidden = !isRunning;

            if (isRunning) {
                document.getElementById("activityName").value =
                    activeActivity.name;

                document.getElementById("activityType").value =
                    activeActivity.activity_type;

                document.getElementById("activityNotes").value =
                    activeActivity.notes ?? "";

                setSaveStatus("● Saved", "saved");
                updateTimer();
            } else {
                document.getElementById("activityName").value = "";
                document.getElementById("activityType").value = "work";
                document.getElementById("activityNotes").value = "";
                document.getElementById("timer").textContent = "00:00:00";

                setSaveStatus("");
            }
        }


        // LOAD ACTIVITIES

        async function loadSessions() {
            const sessions = await apiRequest("/sessions");

            activeActivity = sessions.find(
                activity => activity.ended_at === null
            ) ?? null;

            displayActivityForm();

            const completed = sessions
                .filter(activity => activity.ended_at !== null)
                .sort((a, b) =>
                    parseTimestamp(a.started_at) -
                    parseTimestamp(b.started_at)
                );

            const list = document.getElementById("sessions");
            list.replaceChildren();

            for (const activity of completed) {
                const item = document.createElement("li");

                item.textContent =
                    `${formatTime(activity.started_at)} – ` +
                    `${formatTime(activity.ended_at)} | ` +
                    `${activity.name} (${activity.activity_type})`;

                list.appendChild(item);
            }

            // Show the most recent history entries.
            list.scrollTop = list.scrollHeight;
        }


        // SAVE CURRENT ACTIVITY

        async function saveCurrentActivity() {
            if (!activeActivity) return;

            const data = readActivityForm();

            setSaveStatus("Saving...");

            try {
                await apiRequest(`/sessions/${activeActivity.id}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                setSaveStatus("● Saved", "saved");
            } catch (error) {
                setSaveStatus("● Save failed", "error");
                throw error;
            }
        }


        // BUTTON HANDLING

        async function runAction(action) {
            if (busy) return;

            busy = true;

            const controls = document.querySelectorAll(
                "button, input, select, textarea"
            );

            controls.forEach(control => control.disabled = true);

            try {
                await action();
                await loadSessions();
            } catch (error) {
                setSaveStatus(error.message, "error");
            } finally {
                busy = false;
                controls.forEach(control => control.disabled = false);
            }
        }


        // START

        document.getElementById("startButton").addEventListener("click", () => {
            runAction(async () => {
                const data = readActivityForm();

                await apiRequest("/sessions/start", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });
            });
        });


        // SAVE

        document.getElementById("saveButton").addEventListener("click", () => {
            runAction(async () => {
                await saveCurrentActivity();
            });
        });


        // STOP

        document.getElementById("stopButton").addEventListener("click", () => {
            runAction(async () => {
                await saveCurrentActivity();

                await apiRequest("/sessions/stop", {
                    method: "POST"
                });
            });
        });


        // INITIALIZATION

        loadSessions().catch(error => {
            setSaveStatus(error.message, "error");
        });

        setInterval(updateTimer, 1000);

    </script>

</body>
</html>
